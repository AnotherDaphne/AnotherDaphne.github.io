<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>QR Code Generator</title>
<script src="/script.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<style>
#confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
   pointer-events: none; overflow: hidden; z-index: 999; }
#confetti span { position: absolute; top: -10px; width: 8px; height: 8px; 
   animation: fallConfetti linear forwards; }
@keyframes fallConfetti { to { transform: translateY(110vh) rotate(360deg); } }
</style>
<style>
body {background: #16161d; color: #fff8E7; font-family: sans-serif; user-select: none; letter-spacing:0.05rem;}

.box { display:flex; align-items:center; justify-content:center; flex-direction:column;
    gap:1rem; margin-top:3rem; padding-bottom: 3rem; }
 
input[type="text"] { background: #16161d; color: #fff8E7; width:25%; min-width: 260px;
    border: solid 2px #fff8e7; border-radius:4px; padding: 6px 8px; font-size: 1rem;}
 
.qrcode { border: solid 4px white; border-radius:4px; line-height: 0; }

.controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: center; width: min(600px, 90vw);
    background: #16161d; border: 2px solid #fff8e7; border-radius: 8px; padding: 1.25rem; }
 
.field { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; }
.field input[type="color"] { width: 50px; height: 2.2rem; 
    border: 2px solid #fff8e7; border-radius: 4px; background: none; cursor: pointer; }
 
.field select, .field input[type="file"] { background: #16161d; color: #fff8e7; border: 2px solid #fff8e7;
    border-radius: 4px; padding: 5px 6px; font-size: 0.85rem; cursor: pointer; }

.field input[type="file"]::file-selector-button {padding: 4px 6px; background-color: #16161d; color: #fff8e7; 
    display: inline-block; border-radius: 4px; border: 1px solid #fff8e7; }
.field input[type="file"]::file-selector-button:hover {background-color: #fff8e7;  
    color: #16161d;  transition: 0.3s; cursor:pointer;}
 
.download { background: #16161d; color:#fff8e7; border: 2px solid #fff8e7; border-radius: 4px;
    padding: 6px 14px; font-size: 0.9rem; cursor: pointer; letter-spacing: 0.05rem; }
.download:hover { background: #fff8e7; color:#16161d; transition:0.3s; }

.backbutton { position:absolute; top: 20px; left: 20px; padding:2px 8px; text-decoration:none; font-size:1.5rem;
      background: #16161d; color:#fff8e7; border-radius: 4px; border-color: #fff8e7; border:solid; border-width:1px; }
.backbutton:hover {cursor:pointer; background: #fff8e7; color:#16161d; transition:0.3s} 

#stars { position: fixed; top: 0; left: 0; width: 100%; height: 200%; z-index: -1; overflow: hidden;
animation: scrollStars 60s linear infinite; }
#stars span { position: absolute; width: 2px; height: 2px; background: #fff8e7; border-radius: 50%; }
@keyframes scrollStars {
   from { transform: translateY(-50%); }
   to   { transform: translateY(0); }
}
</style>
</head>

<body>
<div id="stars"></div>
<a class="backbutton" href="/index.html">«</a>

<script>
const starsEl = document.getElementById('stars');
for (let i = 0; i < 300; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%'; // spread across the doubled height
    starsEl.appendChild(s);
}
</script>

<div class="box">
<h2>QR Code Generator</h2>

<div class="qrcode"></div>
<input type="text" placeholder="Enter URL or text" onchange="update()" />

<div class="controls">
    <div class="field">
        <label>Color</label>
        <input type="color" id="color" value="#16161d" oninput="update()">
    </div>
    <div class="field">
        <label>Background</label>
        <input type="color" id="bgColor" value="#fff8e7" oninput="update()">
    </div>
    <div class="field">
        <label>Shape</label>
        <select id="shape" onchange="update()">
            <option value="square" selected>Square</option>
            <option value="dots">Dots</option>
            <option value="rounded">Rounded</option>
            <option value="extra-rounded">Extra rounded</option>
        </select>
    </div>
    <div class="field">
        <label>Logo</label>
        <input type="file" id="logo" accept="image/*" onchange="update()">
    </div>
    <button class="download" onclick="qrcode.download({ name: 'qrcode', extension: 'png' })">Download PNG</button>
</div>
</div>
 
<script>
const qrcode = new QRCodeStyling({
width: 300,
height: 300,
data: "daphnepissios.com/less_silly/qr.html",
imageOptions: { crossOrigin: "anonymous", margin: 6, imageSize: 0.4 },
});
qrcode.append(document.querySelector(".qrcode"));

// Reads the uploaded logo, re-renders the QR code with current settings
function update() {
const text = document.querySelector('input[type="text"]').value.trim() || "https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1";
const color = document.getElementById("color").value;
const shape = document.getElementById("shape").value;

const options = {
    data: text,
    dotsOptions: { color, type: shape },
    cornersSquareOptions: { color, type: shape === "square" ? "square" : "extra-rounded" },
    cornersDotOptions: { color, type: shape === "square" ? "square" : "dot" },
    backgroundOptions: { color: document.getElementById("bgColor").value },
};

const logoFile = document.getElementById("logo").files[0];
if (logoFile) {
    const reader = new FileReader();
    reader.onload = (e) => qrcode.update({ ...options, image: e.target.result });
    reader.readAsDataURL(logoFile);
} else {
    qrcode.update(options);
}
}
</script>

</body>
</html>
