<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano</title>
<style>
body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction:column;
    background: #16161d; font-family: sans-serif; color:#fff8e7;}
#piano { display: flex; gap: 2px; color:#16161d; }
.key { width: 60px; height: 220px; background: white; border: 1px solid black;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; box-sizing: border-box; user-select: none; }
.key.active { background: #87cefa; }

#notes {padding:4px; }
</style>
</head>
<body>

<div id="piano"></div>
<div id="notes">blah blah blah</div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audio = new AudioContext();

const notes = [
    ["a", 261.63], // C4
    ["s", 293.66], // D4
    ["d", 329.63], // E4
    ["f", 349.23], // F4
    ["g", 392.00], // G4
    ["h", 440.00], // A4
    ["j", 493.88], // B4
    ["k", 523.25], // C5
    ["l", 587.33], // D5
    [";", 659.25]  // E5
];

const piano = document.getElementById("piano");
const playing = {};

for (const [key] of notes) {
    const div = document.createElement("div");
    div.className = "key";
    div.id = key;
    div.textContent = key.toUpperCase();
    piano.appendChild(div);
}

function play(freq, key) {
    if (playing[key]) return;

    const osc = audio.createOscillator();
    const gain = audio.createGain();
    const now = audio.currentTime;

    osc.frequency.value = freq;
    osc.type = "sine";

    gain.gain.value = 0.1;

    osc.connect(gain);
    gain.connect(audio.destination);

    // Start silent
    gain.gain.setValueAtTime(0, now);

    // // 10ms attack
    gain.gain.linearRampToValueAtTime(0.2, now + 0.05);

    // release
    gain.gain.linearRampToValueAtTime(0, now);

    osc.start();

    playing[key] = { osc, gain };
    document.getElementById(key).classList.add("active");
}

function stop(key) {
    const sound = playing[key];
    if (!sound) return;

    sound.gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.05);
    sound.osc.stop(audio.currentTime + 0.05);

    delete playing[key];
    document.getElementById(key).classList.remove("active");
}

document.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();
    const note = notes.find(n => n[0] === key);
    if (!note) return;

    audio.resume();
    play(note[1], key);
});

document.addEventListener("keyup", e => {
    stop(e.key.toLowerCase());
});
</script>

</body>
</html>
